<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fff7d6" />
  <title>ポケモン なまえクイズ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">こども向け がくしゅうアプリ</p>
        <h1>ポケモン なまえクイズ</h1>
      </div>
      <button id="homeBtn" class="ghost-btn hidden" type="button">🏠 メニュー</button>
    </header>

    <section id="menuScreen" class="screen active">
      <div class="hero-card">
        <div class="hero-ball" aria-hidden="true">●</div>
        <h2>あそびながら おぼえよう！</h2>
        <p>せだいを えらんで 10もんクイズに ちょうせんできます。</p>
        <div class="menu-actions">
          <button id="goQuizBtn" class="primary-btn big-btn" type="button">🎮 クイズをする</button>
          <button id="goDexBtn" class="secondary-btn big-btn" type="button">📖 ポケモンずかん</button>
        </div>
      </div>
    </section>

    <section id="generationScreen" class="screen">
      <div class="panel">
        <h2>しゅつだいする せだいを えらぼう</h2>
        <p class="muted">いくつでも えらべます。</p>
        <div id="generationGrid" class="generation-grid"></div>
        <div class="row-actions">
          <button id="selectAllBtn" class="small-btn" type="button">すべて えらぶ</button>
          <button id="clearAllBtn" class="small-btn" type="button">すべて はずす</button>
        </div>
        <p id="selectedCount" class="selected-count"></p>
        <button id="startQuizBtn" class="primary-btn big-btn" type="button">クイズ スタート！</button>
      </div>
    </section>

    <section id="quizScreen" class="screen">
      <div class="quiz-top">
        <div id="questionCounter" class="status-pill">1 / 10</div>
        <div id="scoreDisplay" class="status-pill">せいかい 0</div>
      </div>
      <div class="panel quiz-panel">
        <h2>このポケモンは だれ？</h2>
        <div class="image-wrap">
          <div id="imageLoading" class="loading-text">がぞうを よみこみちゅう…</div>
          <img id="quizImage" class="pokemon-image hidden" alt="ポケモンの画像" />
        </div>
        <div id="answerGrid" class="answer-grid"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
        <button id="nextQuestionBtn" class="primary-btn hidden" type="button">つぎの もんだい →</button>
      </div>
    </section>

    <section id="resultScreen" class="screen">
      <div class="panel result-panel">
        <h2>クイズけっか</h2>
        <div id="resultScore" class="result-score"></div>
        <p id="resultMessage" class="result-message"></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>もんだい</th><th>No.</th><th>せいかい</th><th>あなたのこたえ</th><th>けっか</th></tr></thead>
            <tbody id="resultBody"></tbody>
          </table>
        </div>
        <div class="result-actions">
          <button id="retryBtn" class="primary-btn" type="button">おなじ せだいで もういちど</button>
          <button id="changeGenerationBtn" class="secondary-btn" type="button">せだいを えらびなおす</button>
          <button id="resultDexBtn" class="secondary-btn" type="button">ずかんで ふくしゅう</button>
        </div>
      </div>
    </section>

    <section id="dexScreen" class="screen">
      <div class="panel dex-panel">
        <div class="dex-title-row">
          <h2>📖 ポケモンずかん</h2>
          <button id="hideNameBtn" class="small-btn" type="button">なまえを かくす</button>
        </div>
        <div class="image-wrap dex-image-wrap">
          <div id="dexLoading" class="loading-text">がぞうを よみこみちゅう…</div>
          <img id="dexImage" class="pokemon-image hidden" alt="ポケモンの画像" />
        </div>
        <div id="dexNumber" class="dex-number">No.0001</div>
        <div id="dexName" class="dex-name">----</div>
        <div class="dex-nav">
          <button id="prevDexBtn" class="secondary-btn" type="button">← まえ</button>
          <button id="nextDexBtn" class="secondary-btn" type="button">つぎ →</button>
        </div>
        <div class="jump-box">
          <label for="dexJump">ずかんNo.</label>
          <input id="dexJump" type="number" min="1" max="1025" inputmode="numeric" />
          <button id="jumpBtn" class="small-btn" type="button">ジャンプ</button>
        </div>
        <p class="muted small-note">No.1〜1025 に対応しています。</p>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
